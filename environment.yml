name: kermt
channels:
  - rmg
  - conda-forge
  - nvidia
  - rdkit
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - pytorch-gpu=2.9.1
  - rdkit=2025.09.1
  - cuik_molmaker>=0.2,<0.3
  - descriptastorus=2.7.0.4
  - optuna
  - pandas
  - scikit-learn
  - tensorboard
  - wandb
  - huggingface_hub
  - setuptools>=80.0.0,<82.0.0
  - protobuf>=5.29.6
  - pytest
  - pip
  # PyTDC (Therapeutics Data Commons) is PyPI-only -- used by the ADMET
  # benchmarking harness (kermt_admet_group_*.py, build_admet_panels.py).
  - pip:
      - PyTDC==1.1.15
